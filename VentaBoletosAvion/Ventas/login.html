<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AerolineFex - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            background-color: #f4f5f7; 
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg" style="background-color: #002a5c; padding-left: 1vw;">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html" style="color: aliceblue; font-weight:bold; padding-right: 32vw;">AEROLINEFEX</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html" style="color: aliceblue;">Bienvenido</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Vuelos.html" style="color: aliceblue;">Vuelos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Paquetes.html" style="color: aliceblue;">Paquetes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Hoteles.html" style="color: aliceblue;">Hoteles</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Consultas.html" style="color: aliceblue;">Consultas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="Login.html" style="color: #ffc107; font-weight: bold;">Iniciar Sesion</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="card shadow-sm border-0" style="width: 100%; max-width: 420px; border-radius: 10px;">
            <div class="card-body p-4 p-md-5">
                <h4 class="text-center fw-bold mb-2" style="color: #002a5c;">Iniciar Sesión</h4>
                <p class="text-center text-muted small mb-4">Ingresa a tu cuenta para gestionar tus vuelos.</p>
                
                <form>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold" style="color: #002a5c; font-size: 0.9rem;">Correo Electrónico:</label>
                        <input type="email" class="form-control" id="email" placeholder="ejemplo@gmail.com">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold" style="color: #002a5c; font-size: 0.9rem;">Contraseña:</label>
                        <input type="password" class="form-control" id="password" placeholder="********">
                    </div>
                    <button type="submit" class="btn w-100 text-white" style="background-color: #002a5c;">Ingresar</button>
                </form>
            </div>
        </div>
    </div>

    <footer style="background-color: #002a5c; padding: 10px 0; position: fixed; bottom: 0; width: 100%;">
        <p class="text-center text-white m-0 small">© 2026 AerolineFex. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
