<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - AerolineFex</title>
    <!-- Ruta apuntando a tu CSS dentro de VentaBoletosAvion/Ventas/css/ -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Menú Superior (Navbar) -->
    <header class="navbar">
        <div class="container">
            <h1>AerolineFex</h1>
        </div>
    </header>

    <!-- Área Principal Dinámica -->
    <main class="main-content container">
        <div class="login-box">
            <h2>Iniciar Sesión</h2>
            <p>Ingresa a tu cuenta para gestionar tus vuelos.</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" placeholder="ejemplo@gmail.com">
                    <span class="error-message" id="error-email"></span>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" placeholder="********">
                    <span class="error-message" id="error-password"></span>
                </div>

                <button type="submit" class="btn-primary">Ingresar</button>
                <span class="error-message global-error" id="error-global"></span>
            </form>
        </div>
    </main>

    <!-- Pie de página corporativo -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 AerolineFex. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Ruta apuntando a tu JS en la carpeta js/log.js -->
    <script src="js/log.js"></script>
</body>
</html>
